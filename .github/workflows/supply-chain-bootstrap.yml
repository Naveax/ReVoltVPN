name: Supply-chain bootstrap

on:
  push:
    branches:
      - fix/3.3.2-esef-security-cleanup
    paths:
      - .github/workflows/supply-chain-bootstrap.yml

permissions:
  contents: write
  actions: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install verified Gradle wrapper and metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          WORK="$RUNNER_TEMP/revolt-supply-chain"
          rm -rf "$WORK"
          mkdir -p "$WORK/wrapper" "$WORK/metadata"

          download_artifact() {
            local artifact_id="$1"
            local output="$2"
            curl --fail --location --proto '=https' --tlsv1.2 \
              --retry 3 --retry-all-errors \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              --output "$output"
          }

          # Run 26 exported these only after analyze, tests, cold/warm APK,
          # native invariants and the release R8 smoke graph all passed.
          download_artifact 9818721011 "$WORK/wrapper.zip"
          unzip -q "$WORK/wrapper.zip" -d "$WORK/wrapper"
          test -f "$WORK/wrapper/gradle-wrapper.jar"
          test "$(sha256sum "$WORK/wrapper/gradle-wrapper.jar" | awk '{print $1}')" = \
            '7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172'
          test "$(git hash-object "$WORK/wrapper/gradle-wrapper.jar")" = \
            '1b33c55baabb587c669f562ae36f953de2481846'

          download_artifact 9818720403 "$WORK/metadata.zip"
          unzip -q "$WORK/metadata.zip" -d "$WORK/metadata"
          test -f "$WORK/metadata/verification-metadata.xml"
          test "$(sha256sum "$WORK/metadata/verification-metadata.xml" | awk '{print $1}')" = \
            '91020d2e804c80efb9956fda1fe39887db5bb3ae34be419e12f6bf4e665d0596'
          grep -q '<verify-metadata>true</verify-metadata>' "$WORK/metadata/verification-metadata.xml"
          grep -q '<verify-signatures>false</verify-signatures>' "$WORK/metadata/verification-metadata.xml"

          # Use the immutable Gradle 8.14.0 commit, not a moving branch/tag URL.
          GRADLE_COMMIT='34c560e3be961658a6fbcd7170ec2443a228b109'
          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 3 --retry-all-errors \
            "https://raw.githubusercontent.com/gradle/gradle/$GRADLE_COMMIT/gradlew" \
            --output "$WORK/gradlew"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 3 --retry-all-errors \
            "https://raw.githubusercontent.com/gradle/gradle/$GRADLE_COMMIT/gradlew.bat" \
            --output "$WORK/gradlew.bat"
          test "$(git hash-object "$WORK/gradlew")" = \
            '0f14772e0e50ffe504fa3be1a869e6281b09ccd1'
          test "$(git hash-object "$WORK/gradlew.bat")" = \
            '8de1053a1f921b9ac5910187e2f99fdaa774f81a'

          install -m 0755 "$WORK/gradlew" android/gradlew
          install -m 0644 "$WORK/gradlew.bat" android/gradlew.bat
          install -m 0644 "$WORK/wrapper/gradle-wrapper.jar" \
            android/gradle/wrapper/gradle-wrapper.jar
          install -m 0644 "$WORK/metadata/verification-metadata.xml" \
            android/gradle/verification-metadata.xml

          python3 - <<'PY'
          from pathlib import Path

          removals = {
              Path('.gitignore'): {
                  '**/android/gradlew',
                  '**/android/gradlew.bat',
                  '**/android/**/gradle-wrapper.jar',
              },
              Path('android/.gitignore'): {
                  'gradle-wrapper.jar',
                  '/gradlew',
                  '/gradlew.bat',
              },
          }

          for path, forbidden in removals.items():
              lines = path.read_text(encoding='utf-8').splitlines()
              remaining = [line for line in lines if line not in forbidden]
              missing = forbidden.difference(lines)
              if missing:
                  raise SystemExit(f'{path}: expected ignore rules missing: {sorted(missing)}')
              path.write_text('\n'.join(remaining) + '\n', encoding='utf-8')
          PY

          grep -qx 'distributionSha256Sum=efe9a3d147d948d7528a9887fa35abcf24ca1a43ad06439996490f77569b02d1' \
            android/gradle/wrapper/gradle-wrapper.properties
          test "$(git hash-object android/gradlew)" = \
            '0f14772e0e50ffe504fa3be1a869e6281b09ccd1'
          test "$(git hash-object android/gradlew.bat)" = \
            '8de1053a1f921b9ac5910187e2f99fdaa774f81a'
          test "$(git hash-object android/gradle/wrapper/gradle-wrapper.jar)" = \
            '1b33c55baabb587c669f562ae36f953de2481846'
          test "$(sha256sum android/gradle/verification-metadata.xml | awk '{print $1}')" = \
            '91020d2e804c80efb9956fda1fe39887db5bb3ae34be419e12f6bf4e665d0596'

          ! git check-ignore -q android/gradlew
          ! git check-ignore -q android/gradlew.bat
          ! git check-ignore -q android/gradle/wrapper/gradle-wrapper.jar

          # The bootstrap is deliberately self-deleting. No persistent workflow
          # with repository write permission remains after this commit.
          git rm .github/workflows/supply-chain-bootstrap.yml
          git add .gitignore android/.gitignore \
            android/gradlew android/gradlew.bat \
            android/gradle/wrapper/gradle-wrapper.jar \
            android/gradle/verification-metadata.xml
          git diff --cached --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(android): vendor verified Gradle supply chain'
          git push origin "HEAD:$GITHUB_REF_NAME"
