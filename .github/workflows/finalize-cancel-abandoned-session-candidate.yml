name: finalize-cancel-abandoned-session-candidate

on:
  push:
    branches:
      - hardening/cancel-abandoned-session-candidate
    paths:
      - '.github/workflows/finalize-cancel-abandoned-session-candidate.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: hardening/cancel-abandoned-session-candidate
          fetch-depth: 1

      - name: Install pinned Flutter SDK
        run: |
          set -Eeuo pipefail
          sdk="$RUNNER_TEMP/flutter"
          expected_sha=6b182d2c7585eba26d4edce0f97630effd256c33
          expected_tag=3.44.9
          git clone --depth=1 --branch "$expected_tag" --single-branch https://github.com/flutter/flutter.git "$sdk"
          [[ "$(git -C "$sdk" rev-parse HEAD)" == "$expected_sha" ]]
          [[ "$(git -C "$sdk" describe --tags --exact-match HEAD)" == "$expected_tag" ]]
          printf '%s\n' "$sdk/bin" >> "$GITHUB_PATH"

      - name: Format and validate candidate cleanup contract
        run: |
          set -Eeuo pipefail
          dart format lib/logic/ad_manager.dart lib/logic/hivemind_service.dart
          python3 tool/check_admob_candidate_contract.py
          rm .github/workflows/finalize-cancel-abandoned-session-candidate.yml
          git diff --check

      - name: Commit final candidate
        run: |
          set -Eeuo pipefail
          git config user.name Naveax
          git config user.email Omersevik095@gmail.com
          git add -A
          git diff --cached --check
          git commit -m 'Bind abandoned candidate cleanup contract'
          git push origin HEAD:hardening/cancel-abandoned-session-candidate
