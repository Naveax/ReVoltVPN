name: Build Android ASS release

on:
  push:
    branches:
      - build/android-ass-release

permissions:
  contents: read

concurrency:
  group: android-ass-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Generate local build config
        shell: bash
        run: |
          cat > lib/logic/app_config.dart <<'DART'
          abstract final class AppConfig {
            AppConfig._();
            static const String serverIp = '204.168.246.88';
            static const String hivemindApiPublic = 'https://paladinvpn.duckdns.org/api';
            static const String realityFp = 'chrome';
            static const String vlessSecurity = 'reality';
            static const String vlessType = 'xhttp';
            static const String vlessPath = '/revolt';
            static const String applicationId = 'com.paladinvpn.app';
            static const String githubOwner = 'esefxdz';
            static const String githubRepo = 'ReVoltVPN';
            static const String githubReleasesUrl =
                'https://github.com/$githubOwner/$githubRepo/releases/latest';
            static const String adUnitId =
                'ca-app-pub-5671224884648691/9198987725';
          }
          DART

          # Build-only manifest value. Ads remain disabled in source.
          cat > android/admob.properties <<'PROPS'
          ADMOB_APP_ID=ca-app-pub-3940256099942544~3347511713
          PROPS

          {
            printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT"
            printf 'sdk.dir=%s\n' "$ANDROID_HOME"
          } > android/local.properties

      - name: Generate temporary release signing key
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore android/revolt-ass-test-release.jks \
            -storepass revoltassrelease \
            -keypass revoltassrelease \
            -alias revolt-ass-test \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=ReVoltVPN ASS Test Release,O=ReVoltVPN,C=US"

          cat > android/key.properties <<'PROPS'
          storePassword=revoltassrelease
          keyPassword=revoltassrelease
          keyAlias=revolt-ass-test
          storeFile=revolt-ass-test-release.jks
          PROPS

      - name: Restore Gradle wrapper
        shell: bash
        run: |
          cd android
          gradle wrapper --gradle-version 8.14 --distribution-type all
          chmod +x gradlew

      - name: Flutter pub get
        run: flutter pub get

      - name: Verify ASS routing and legacy invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path('lib/logic/connection_settings.dart').read_text()
          vpn = Path('lib/logic/vpn_connection.dart').read_text()
          routing = Path('lib/logic/app_specific_routing.dart').read_text()
          service = Path('android/app/src/main/kotlin/com/paladinvpn/app/AppRoutingVpnService.kt').read_text()
          activity = Path('android/app/src/main/kotlin/com/paladinvpn/app/MainActivity.kt').read_text()
          manifest = Path('android/app/src/main/AndroidManifest.xml').read_text()
          mode_ui = Path('lib/screens/settings/in_settings/connection_mode.dart').read_text()
          app_ui = Path('lib/screens/settings/in_settings/app_routing.dart').read_text()
          diagnostics = Path('lib/screens/settings/in_settings/diagnostics.dart').read_text()
          ad = Path('lib/logic/ad_manager.dart').read_text()
          hivemind = Path('lib/logic/hivemind_service.dart').read_text()

          assert 'ConnectionMode { tun, proxy, ass }' in settings
          assert "MethodChannel('com.revoltvpn.app/app_routing')" in routing
          assert 'builder.addAllowedApplication(appPackage)' in service
          assert 'socks5://127.0.0.1:10807' in service
          assert 'AppRoutingVpnService' in manifest
          assert 'android.permission.BIND_VPN_SERVICE' in manifest
          assert 'com.revoltvpn.app/app_routing' in activity
          assert 'ConnectionMode.ass' in vpn
          assert 'runtimeProxyOnly: true' in vpn
          assert 'AppSpecificRouting.start' in vpn
          assert 'App Specific (ASS)' in mode_ui
          assert 'strict native allowlist' in app_ui
          assert 'App Specific wrapper' in diagnostics

          # Existing legacy/dev AdMob + nonce path must remain untouched.
          assert 'static const bool adsEnabled = false;' in ad
          assert '?signature=test&key_id=test' in ad
          assert 'HivemindService.setExpectedNonce(nonce)' in ad
          assert '/admob/callback?signature=test&key_id=test' in hivemind
          print('ASS routing and legacy AdMob/nonce invariants verified')
          PY

      - name: Generate unit tests
        shell: bash
        run: |
          mkdir -p test
          cat > test/android_ass_ci_test.dart <<'DART'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:revoltvpn/logic/connection_settings.dart';

          void main() {
            TestWidgetsFlutterBinding.ensureInitialized();

            test('ASS mode and selected packages persist', () async {
              SharedPreferences.setMockInitialValues(<String, Object>{});
              await ConnectionSettings.initialize();

              await ConnectionSettings.setMode(ConnectionMode.ass);
              await ConnectionSettings.setRoutingMode(AppRoutingMode.selected);
              await ConnectionSettings.setAppPackages(<String>[
                'com.example.discord',
                ' com.example.telegram ',
                'com.example.discord',
              ]);

              expect(ConnectionSettings.mode, ConnectionMode.ass);
              expect(ConnectionSettings.routingMode, AppRoutingMode.selected);
              expect(
                ConnectionSettings.appPackages,
                <String>['com.example.discord', 'com.example.telegram'],
              );
            });
          }
          DART

      - name: Flutter analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test test/android_ass_ci_test.dart

      - name: Public API health
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 10 \
            https://paladinvpn.duckdns.org/api/health
          echo

      - name: Build release APK
        run: flutter build apk --release --build-name 3.3.0 --build-number 27

      - name: Build release AAB
        run: flutter build appbundle --release --build-name 3.3.0 --build-number 27

      - name: Package release artifacts
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk ReVoltVPN-3.3.0-ass-release-test.apk
          cp build/app/outputs/bundle/release/app-release.aab ReVoltVPN-3.3.0-ass-release-test.aab
          sha256sum ReVoltVPN-3.3.0-ass-release-test.apk > ReVoltVPN-3.3.0-ass-release-test.apk.sha256
          sha256sum ReVoltVPN-3.3.0-ass-release-test.aab > ReVoltVPN-3.3.0-ass-release-test.aab.sha256

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReVoltVPN-3.3.0-ass-release-test
          path: |
            ReVoltVPN-3.3.0-ass-release-test.apk
            ReVoltVPN-3.3.0-ass-release-test.apk.sha256
            ReVoltVPN-3.3.0-ass-release-test.aab
            ReVoltVPN-3.3.0-ass-release-test.aab.sha256
          retention-days: 3
          if-no-files-found: error
