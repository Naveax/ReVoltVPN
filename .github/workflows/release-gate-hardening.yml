name: Release gate hardening v2 APK

on:
  push:
    branches:
      - fix/release-gate-hardening-v2

permissions:
  contents: read

concurrency:
  group: release-gate-hardening-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Generate local build configuration
        shell: bash
        run: |
          cat > lib/logic/app_config.dart <<'DART'
          abstract final class AppConfig {
            AppConfig._();
            static const String serverIp = '204.168.246.88';
            static const String hivemindApiPublic = 'https://paladinvpn.duckdns.org/api';
            static const String realityFp = 'chrome';
            static const String vlessSecurity = 'reality';
            static const String vlessType = 'xhttp';
            static const String vlessPath = '/revolt';
            static const String applicationId = 'com.paladinvpn.app';
            static const String githubOwner = 'esefxdz';
            static const String githubRepo = 'ReVoltVPN';
            static const String githubReleasesUrl =
                'https://github.com/$githubOwner/$githubRepo/releases/latest';
            static const String adUnitId =
                'ca-app-pub-5671224884648691/9198987725';
          }
          DART
          cat > android/admob.properties <<'PROPS'
          ADMOB_APP_ID=ca-app-pub-3940256099942544~3347511713
          PROPS
          {
            printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT"
            printf 'sdk.dir=%s\n' "$ANDROID_HOME"
          } > android/local.properties

      - name: Generate temporary test release key
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore android/revolt-release-gate-v2.jks \
            -storepass revoltgateway \
            -keypass revoltgateway \
            -alias revolt-release-gate-v2 \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=ReVoltVPN Release Gate V2 Test,O=ReVoltVPN,C=US"
          cat > android/key.properties <<'PROPS'
          storePassword=revoltgateway
          keyPassword=revoltgateway
          keyAlias=revolt-release-gate-v2
          storeFile=revolt-release-gate-v2.jks
          PROPS

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          cd android
          gradle wrapper --gradle-version 8.14 --distribution-type all
          chmod +x gradlew
          ./gradlew --version

      - name: Flutter pub get
        run: flutter pub get

      - name: Verify hardened datapath invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('.')
          service = (root/'third_party/flutter_vless_android/android/src/main/kotlin/com/github/tfox/flutter_vless/xray/service/XrayVPNService.kt').read_text()
          core = (root/'third_party/flutter_vless_android/android/src/main/kotlin/com/github/tfox/flutter_vless/xray/core/XrayCoreManager.kt').read_text()
          plugin = (root/'third_party/flutter_vless_android/android/src/main/kotlin/com/github/tfox/flutter_vless/FlutterVlessPlugin.kt').read_text()
          manifest = (root/'third_party/flutter_vless_android/android/src/main/AndroidManifest.xml').read_text()
          pubspec = (root/'pubspec.yaml').read_text()
          vpn = (root/'lib/logic/vpn_connection.dart').read_text()
          native = (root/'lib/logic/native_tunnel_control.dart').read_text()
          timer = (root/'lib/logic/session_timer.dart').read_text()
          ad = (root/'lib/logic/ad_manager.dart').read_text()
          hivemind = (root/'lib/logic/hivemind_service.dart').read_text()

          # Fail-closed startup and known-good ordering.
          assert 'Android refused to establish the VPN interface' in service
          assert 'TUN file descriptor was not delivered to tun2socks' in service
          assert 'Authenticated Local SOCKS5 did not become ready' in service
          assert service.index('waitForSocks(config, generation, attempts = 40)') < service.index('setupVpn(config, generation)')
          assert 'Thread.sleep(500L)' in service
          assert 'override fun onRevoke()' in service
          assert '"-loglevel", "warning"' in service
          assert 'builder.addAddress("fd00:26:26::1"' not in service
          assert 'builder.addRoute("::", 0)' not in service

          # Same-process readiness removes the fragile daemon-state bridge.
          assert 'android:process=' not in manifest
          assert 'android:exported="false"' in manifest
          assert 'RECEIVER_NOT_EXPORTED' in plugin
          assert 'protectionLevel="signature"' in manifest

          # Only one ReVolt-owned authenticated inbound. No HTTP/API/imported listeners.
          assert 'configJson.put("inbounds", inbounds)' in core
          assert 'configJson.remove("api")' in core
          assert 'configJson.remove("stats")' in core
          assert 'auth", "password"' in core
          assert 'config.LOCAL_HTTP_PORT = 0' in core
          assert 'config.LOCAL_API_PORT = 0' in core
          assert 'protocol", "http"' not in core
          assert 'dokodemo-door' not in core

          # App cannot show Secured from the legacy CONNECTED event alone.
          assert 'NativeTunnelControl.waitUntilReady()' in vpn
          assert 'if (!native.fullyReady) return;' in vpn
          assert "state == 'CONNECTED'" in native
          assert 'tunEstablished &&' in native
          assert 'fdDelivered &&' in native
          assert 'socksReady &&' in native

          # Build isolation and timer accounting.
          assert 'path: third_party/flutter_vless_android' in pubspec
          assert not (root/'tool/patch_flutter_vless_allowed_apps.dart').exists()
          assert '_lastSuccessfulSyncAt' in timer
          assert 'now.difference(previousSyncAt).inMilliseconds' in timer

          # Intentionally preserved fake AdMob/nonce path.
          assert 'static const bool adsEnabled = false;' in ad
          assert '?signature=test&key_id=test' in ad
          assert 'HivemindService.setExpectedNonce(nonce)' in ad
          assert '/admob/callback?signature=test&key_id=test' in hivemind
          print('Hardened datapath invariants verified')
          PY

      - name: Flutter analyze
        run: flutter analyze --no-fatal-warnings

      - name: Unit tests
        run: flutter test

      - name: Kotlin release compile smoke test
        shell: bash
        run: |
          cd android
          ./gradlew :app:compileReleaseKotlin --stacktrace

      - name: Build release APK
        run: flutter build apk --release --build-name 3.3.7 --build-number 34

      - name: Verify packaged VPN runtime
        shell: bash
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep 'libtun2socks.so'
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep 'libxray.so'

      - name: Package APK
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk ReVoltVPN-3.3.7-hardening-v2.apk
          sha256sum ReVoltVPN-3.3.7-hardening-v2.apk > ReVoltVPN-3.3.7-hardening-v2.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReVoltVPN-3.3.7-hardening-v2-apk
          path: |
            ReVoltVPN-3.3.7-hardening-v2.apk
            ReVoltVPN-3.3.7-hardening-v2.apk.sha256
          retention-days: 3
          if-no-files-found: error
