name: Build no-ASS final

on:
  push:
    branches:
      - fix/transparent-socks-ass-auto

permissions:
  contents: read

concurrency:
  group: no-ass-final-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Generate local build config
        shell: bash
        run: |
          cat > lib/logic/app_config.dart <<'DART'
          abstract final class AppConfig {
            AppConfig._();
            static const String serverIp = '204.168.246.88';
            static const String hivemindApiPublic = 'https://paladinvpn.duckdns.org/api';
            static const String realityFp = 'chrome';
            static const String vlessSecurity = 'reality';
            static const String vlessType = 'xhttp';
            static const String vlessPath = '/revolt';
            static const String applicationId = 'com.paladinvpn.app';
            static const String githubOwner = 'esefxdz';
            static const String githubRepo = 'ReVoltVPN';
            static const String githubReleasesUrl =
                'https://github.com/$githubOwner/$githubRepo/releases/latest';
            static const String adUnitId =
                'ca-app-pub-5671224884648691/9198987725';
          }
          DART

          cat > android/admob.properties <<'PROPS'
          ADMOB_APP_ID=ca-app-pub-3940256099942544~3347511713
          PROPS

          {
            printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT"
            printf 'sdk.dir=%s\n' "$ANDROID_HOME"
          } > android/local.properties

      - name: Generate temporary release signing key
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore android/revolt-no-ass-final.jks \
            -storepass revoltfinaltest \
            -keypass revoltfinaltest \
            -alias revolt-no-ass-final \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=ReVoltVPN Final Test,O=ReVoltVPN,C=US"

          cat > android/key.properties <<'PROPS'
          storePassword=revoltfinaltest
          keyPassword=revoltfinaltest
          keyAlias=revolt-no-ass-final
          storeFile=revolt-no-ass-final.jks
          PROPS

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          cd android
          gradle wrapper --gradle-version 8.14 --distribution-type all
          chmod +x gradlew
          ./gradlew --version

      - name: Flutter pub get
        run: flutter pub get

      - name: Verify routing invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          settings = Path('lib/logic/connection_settings.dart').read_text()
          vpn = Path('lib/logic/vpn_connection.dart').read_text()
          mode_ui = Path('lib/screens/settings/in_settings/connection_mode.dart').read_text()
          routing_ui = Path('lib/screens/settings/in_settings/app_routing.dart').read_text()
          gradle = Path('android/app/build.gradle.kts').read_text()
          ad = Path('lib/logic/ad_manager.dart').read_text()
          hivemind = Path('lib/logic/hivemind_service.dart').read_text()

          assert 'enum ConnectionMode { auto, tun, proxy }' in settings
          assert "storedMode == 'ass'" in settings
          assert 'ConnectionMode.ass' not in vpn
          assert 'App Specific' not in mode_ui
          assert 'App Specific' not in routing_ui
          assert 'patchFlutterVlessAllowedApps' not in gradle
          assert 'proxyOnly: true' not in vpn
          assert 'verifyLocalSocks: true' in vpn
          assert '_selectedCompatibilityPlan' in vpn
          assert 'blockedApps: blocked.isEmpty ? null : blocked' in vpn
          assert 'AppRoutingVpnService' not in Path('android/app/src/main/AndroidManifest.xml').read_text()

          assert 'static const bool adsEnabled = false;' in ad
          assert '?signature=test&key_id=test' in ad
          assert 'HivemindService.setExpectedNonce(nonce)' in ad
          assert '/admob/callback?signature=test&key_id=test' in hivemind
          print('Final routing invariants verified')
          PY

      - name: Generate migration unit test
        shell: bash
        run: |
          mkdir -p test
          cat > test/no_ass_migration_test.dart <<'DART'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:revoltvpn/logic/connection_settings.dart';

          void main() {
            TestWidgetsFlutterBinding.ensureInitialized();

            test('legacy ASS migrates to SOCKS selected', () async {
              SharedPreferences.setMockInitialValues(<String, Object>{
                'connection_mode': 'ass',
                'app_routing_mode': 'selected',
                'app_routing_packages': <String>['com.android.chrome', 'com.discord'],
              });
              await ConnectionSettings.initialize();
              expect(ConnectionSettings.mode, ConnectionMode.proxy);
              expect(ConnectionSettings.routingMode, AppRoutingMode.selected);
              expect(ConnectionSettings.appPackages, <String>['com.android.chrome', 'com.discord']);
            });
          }
          DART

      - name: Flutter analyze
        run: flutter analyze --no-fatal-warnings

      - name: Unit tests
        run: flutter test test/no_ass_migration_test.dart

      - name: Public API health
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 10 \
            https://paladinvpn.duckdns.org/api/health
          echo

      - name: Build release APK
        run: flutter build apk --release --build-name 3.3.5 --build-number 32

      - name: Build release AAB
        run: flutter build appbundle --release --build-name 3.3.5 --build-number 32

      - name: Verify packaged VPN runtime
        shell: bash
        run: |
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep 'libtun2socks.so'
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep 'libxray.so'

      - name: Package release artifacts
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk ReVoltVPN-3.3.5-no-ass-final.apk
          cp build/app/outputs/bundle/release/app-release.aab ReVoltVPN-3.3.5-no-ass-final.aab
          sha256sum ReVoltVPN-3.3.5-no-ass-final.apk > ReVoltVPN-3.3.5-no-ass-final.apk.sha256
          sha256sum ReVoltVPN-3.3.5-no-ass-final.aab > ReVoltVPN-3.3.5-no-ass-final.aab.sha256

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReVoltVPN-3.3.5-no-ass-final
          path: |
            ReVoltVPN-3.3.5-no-ass-final.apk
            ReVoltVPN-3.3.5-no-ass-final.aab
            ReVoltVPN-3.3.5-no-ass-final.apk.sha256
            ReVoltVPN-3.3.5-no-ass-final.aab.sha256
          retention-days: 3
          if-no-files-found: error
