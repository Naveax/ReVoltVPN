name: Verification metadata fix

on:
  push:
    branches:
      - fix/3.3.2-esef-security-cleanup
    paths:
      - .github/workflows/verification-metadata-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Add only independently verified missing checksums
        shell: bash
        run: |
          set -euo pipefail
          FILE='android/gradle/verification-metadata.xml'
          test "$(git hash-object "$FILE")" = '263e0175851281fbfdc2d4e3d6950a791345e096'
          test "$(sha256sum "$FILE" | awk '{print $1}')" = '91020d2e804c80efb9956fda1fe39887db5bb3ae34be419e12f6bf4e665d0596'
          python3 -c 'from pathlib import Path; import base64; p=Path("android/gradle/verification-metadata.xml"); s=p.read_text(encoding="utf-8"); ka=base64.b64decode("ICAgICAgPGNvbXBvbmVudCBncm91cD0ib3JnLmpldGJyYWlucy5rb3RsaW4iIG5hbWU9ImtvdGxpbi1ncmFkbGUtcGx1Z2lucy1ib20iIHZlcnNpb249IjIuMi4yMCI+").decode(); kb=base64.b64decode("").decode(); ca=base64.b64decode("ICAgICAgPGNvbXBvbmVudCBncm91cD0ib3JnLmpldGJyYWlucy5rb3RsaW54IiBuYW1lPSJrb3RsaW54LWNvcm91dGluZXMtYm9tIiB2ZXJzaW9uPSIxLjguMSI+").decode(); cb=base64.b64decode("").decode(); assert "name=\"kotlin-gradle-plugins-bom\" version=\"2.0.21\"" not in s; assert "name=\"kotlinx-coroutines-bom\" version=\"1.8.0\"" not in s; assert s.count(ka)==1 and s.count(ca)==1; p.write_text(s.replace(ka,kb+ka,1).replace(ca,cb+ca,1),encoding="utf-8")'
          test "$(git hash-object "$FILE")" = 'e48bca7d6225665ef33cc0dc4bf0609be0631996'
          test "$(sha256sum "$FILE" | awk '{print $1}')" = '90f66e5c14f1b20222b593f6beaa66e5d39ab91456a6abec8af57db25e5efad6'
          git rm .github/workflows/verification-metadata-fix.yml
          git add "$FILE"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(android): trust required plugin BOM metadata'
          git push origin "HEAD:$GITHUB_REF_NAME"
