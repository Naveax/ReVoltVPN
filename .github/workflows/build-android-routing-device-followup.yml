name: Build Android routing device followup

on:
  push:
    branches:
      - build/android-routing-device-followup

permissions:
  contents: read

concurrency:
  group: android-routing-device-followup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Generate local build config
        shell: bash
        run: |
          cat > lib/logic/app_config.dart <<'DART'
          abstract final class AppConfig {
            AppConfig._();
            static const String serverIp = '204.168.246.88';
            static const String hivemindApiPublic = 'https://paladinvpn.duckdns.org/api';
            static const String realityFp = 'chrome';
            static const String vlessSecurity = 'reality';
            static const String vlessType = 'xhttp';
            static const String vlessPath = '/revolt';
            static const String applicationId = 'com.paladinvpn.app';
            static const String githubOwner = 'esefxdz';
            static const String githubRepo = 'ReVoltVPN';
            static const String githubReleasesUrl =
                'https://github.com/$githubOwner/$githubRepo/releases/latest';
            static const String adUnitId =
                'ca-app-pub-5671224884648691/9198987725';
          }
          DART

          cat > android/admob.properties <<'PROPS'
          ADMOB_APP_ID=ca-app-pub-3940256099942544~3347511713
          PROPS

          {
            printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT"
            printf 'sdk.dir=%s\n' "$ANDROID_HOME"
          } > android/local.properties

      - name: Generate temporary release signing key
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore android/revolt-routing-followup.jks \
            -storepass revoltroutingfollowup \
            -keypass revoltroutingfollowup \
            -alias revolt-routing-followup \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=ReVoltVPN Routing Followup,O=ReVoltVPN,C=US"

          cat > android/key.properties <<'PROPS'
          storePassword=revoltroutingfollowup
          keyPassword=revoltroutingfollowup
          keyAlias=revolt-routing-followup
          storeFile=revolt-routing-followup.jks
          PROPS

      - name: Restore Gradle wrapper
        shell: bash
        run: |
          cd android
          gradle wrapper --gradle-version 8.14 --distribution-type all
          chmod +x gradlew

      - name: Flutter pub get
        run: flutter pub get

      - name: Verify device fix invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path('lib/logic/connection_settings.dart').read_text()
          routing = Path('lib/logic/app_specific_routing.dart').read_text()
          service = Path('android/app/src/main/kotlin/com/paladinvpn/app/AppRoutingVpnService.kt').read_text()
          activity = Path('android/app/src/main/kotlin/com/paladinvpn/app/MainActivity.kt').read_text()
          resilience = Path('lib/screens/settings/in_settings/resilience.dart').read_text()
          ad = Path('lib/logic/ad_manager.dart').read_text()
          hivemind = Path('lib/logic/hivemind_service.dart').read_text()

          assert '.addAddress("26.26.26.1", 30)' in service
          assert 'return START_NOT_STICKY' in service
          assert 'STATE_RUNNING' in service
          assert 'statusSnapshot()' in service
          assert '"status" -> result.success(AppRoutingVpnService.statusSnapshot())' in activity
          assert "invokeMapMethod<String, dynamic>('status')" in routing
          assert 'Native app routing did not become ready' in routing
          assert 'static ResilienceMode get resilienceMode => ResilienceMode.standard;' in settings
          assert 'configuredResilienceMode' in settings
          assert 'compatibility-safe' in resilience

          # Legacy/dev AdMob + nonce flow is intentionally untouched.
          assert 'static const bool adsEnabled = false;' in ad
          assert '?signature=test&key_id=test' in ad
          assert 'HivemindService.setExpectedNonce(nonce)' in ad
          assert '/admob/callback?signature=test&key_id=test' in hivemind
          print('Device routing followup invariants verified')
          PY

      - name: Generate unit tests
        shell: bash
        run: |
          mkdir -p test
          cat > test/android_routing_followup_ci_test.dart <<'DART'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:revoltvpn/logic/connection_settings.dart';

          void main() {
            TestWidgetsFlutterBinding.ensureInitialized();

            test('Extreme preference is preserved while runtime stays stable', () async {
              SharedPreferences.setMockInitialValues(<String, Object>{});
              await ConnectionSettings.initialize();
              await ConnectionSettings.setResilienceMode(ResilienceMode.extreme);

              expect(
                ConnectionSettings.configuredResilienceMode,
                ResilienceMode.extreme,
              );
              expect(ConnectionSettings.resilienceMode, ResilienceMode.standard);
            });
          }
          DART

      - name: Flutter analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test test/android_routing_followup_ci_test.dart

      - name: Public API health
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 10 \
            https://paladinvpn.duckdns.org/api/health
          echo

      - name: Build release APK
        run: flutter build apk --release --build-name 3.3.2 --build-number 29

      - name: Package release artifact
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk ReVoltVPN-3.3.2-routing-followup-release.apk
          sha256sum ReVoltVPN-3.3.2-routing-followup-release.apk > ReVoltVPN-3.3.2-routing-followup-release.apk.sha256

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReVoltVPN-3.3.2-routing-followup-release
          path: |
            ReVoltVPN-3.3.2-routing-followup-release.apk
            ReVoltVPN-3.3.2-routing-followup-release.apk.sha256
          retention-days: 3
          if-no-files-found: error
