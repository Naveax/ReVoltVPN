name: Build Android routing resilience v2

on:
  push:
    branches:
      - build/android-routing-resilience-v2-apk

permissions:
  contents: read

concurrency:
  group: android-routing-resilience-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Generate local build config
        shell: bash
        run: |
          cat > lib/logic/app_config.dart <<'DART'
          abstract final class AppConfig {
            AppConfig._();
            static const String serverIp = '204.168.246.88';
            static const String hivemindApiPublic = 'https://paladinvpn.duckdns.org/api';
            static const String realityFp = 'chrome';
            static const String vlessSecurity = 'reality';
            static const String vlessType = 'xhttp';
            static const String vlessPath = '/revolt';
            static const String applicationId = 'com.paladinvpn.app';
            static const String githubOwner = 'esefxdz';
            static const String githubRepo = 'ReVoltVPN';
            static const String githubReleasesUrl =
                'https://github.com/$githubOwner/$githubRepo/releases/latest';
            static const String adUnitId =
                'ca-app-pub-5671224884648691/9198987725';
          }
          DART

          cat > android/admob.properties <<'PROPS'
          ADMOB_APP_ID=ca-app-pub-3940256099942544~3347511713
          PROPS

          {
            printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT"
            printf 'sdk.dir=%s\n' "$ANDROID_HOME"
          } > android/local.properties

          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/gradle.properties')
          lines = p.read_text().splitlines()
          lines = [line for line in lines if not line.startswith('org.gradle.jvmargs=') and not line.startswith('org.gradle.workers.max=')]
          lines.insert(0, 'org.gradle.workers.max=2')
          lines.insert(0, 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8')
          p.write_text('\n'.join(lines) + '\n')
          PY

      - name: Restore Gradle wrapper
        shell: bash
        run: |
          cd android
          gradle wrapper --gradle-version 8.14 --distribution-type all
          chmod +x gradlew

      - name: Flutter pub get
        run: flutter pub get

      - name: Verify feature wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          vpn = Path('lib/logic/vpn_connection.dart').read_text()
          settings = Path('lib/logic/connection_settings.dart').read_text()
          routing = Path('lib/screens/settings/in_settings/app_routing.dart').read_text()
          resilience = Path('lib/screens/settings/in_settings/resilience.dart').read_text()
          activity = Path('android/app/src/main/kotlin/com/paladinvpn/app/MainActivity.kt').read_text()
          ad = Path('lib/logic/ad_manager.dart').read_text()
          hivemind = Path('lib/logic/hivemind_service.dart').read_text()

          assert 'AppRoutingMode { all, exclude, selected }' in settings
          assert 'ResilienceMode { standard, extreme }' in settings
          assert 'Only ' in routing and 'Selected only' in routing
          assert 'Image.memory' in routing
          assert 'appIconPng' in activity and 'ByteArrayOutputStream' in activity
          assert "['stream-up', 'packet-up']" in vpn
          assert '_scheduleRuntimeRestart' in vpn
          assert 'getConnectedServerDelay' in vpn
          assert 'InstalledAppsService.loadLaunchableApps' in vpn
          assert 'Extreme:' in resilience

          # Preserve the legacy/debug AdMob and nonce flow exactly in this feature.
          assert 'static const bool adsEnabled = false;' in ad
          assert '?signature=test&key_id=test' in ad
          assert 'HivemindService.setExpectedNonce(nonce)' in ad
          assert '/admob/callback?signature=test&key_id=test' in hivemind
          print('routing/resilience wiring verified')
          PY

      - name: Generate unit tests
        shell: bash
        run: |
          mkdir -p test
          cat > test/routing_resilience_ci_test.dart <<'DART'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:revoltvpn/logic/connection_settings.dart';

          void main() {
            TestWidgetsFlutterBinding.ensureInitialized();

            test('routing and resilience settings persist writes', () async {
              SharedPreferences.setMockInitialValues(<String, Object>{});
              await ConnectionSettings.initialize();

              expect(ConnectionSettings.mode, ConnectionMode.tun);
              expect(ConnectionSettings.routingMode, AppRoutingMode.all);
              expect(ConnectionSettings.resilienceMode, ResilienceMode.standard);

              await ConnectionSettings.setRoutingMode(AppRoutingMode.selected);
              await ConnectionSettings.setResilienceMode(ResilienceMode.extreme);
              await ConnectionSettings.setAppPackages(<String>[
                'com.example.second',
                ' com.example.first ',
                'com.example.second',
                '',
              ]);

              expect(ConnectionSettings.routingMode, AppRoutingMode.selected);
              expect(ConnectionSettings.resilienceMode, ResilienceMode.extreme);
              expect(
                ConnectionSettings.appPackages,
                <String>['com.example.first', 'com.example.second'],
              );
            });
          }
          DART

      - name: Flutter analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test test/routing_resilience_ci_test.dart

      - name: Public API health
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 10 \
            https://paladinvpn.duckdns.org/api/health
          echo

      - name: Probe remote SOCKS ports
        shell: bash
        run: |
          python3 - <<'PY'
          import socket
          host = '204.168.246.88'
          for port in (1080, 10807, 10808):
              s = socket.socket()
              s.settimeout(2)
              try:
                  s.connect((host, port))
                  print(f'{host}:{port} OPEN')
              except OSError as e:
                  print(f'{host}:{port} closed/unreachable ({e.__class__.__name__})')
              finally:
                  s.close()
          PY

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Package APK
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk ReVoltVPN-routing-resilience-v2-debug.apk
          sha256sum ReVoltVPN-routing-resilience-v2-debug.apk > ReVoltVPN-routing-resilience-v2-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReVoltVPN-routing-resilience-v2-debug
          path: |
            ReVoltVPN-routing-resilience-v2-debug.apk
            ReVoltVPN-routing-resilience-v2-debug.apk.sha256
          retention-days: 3
          if-no-files-found: error
