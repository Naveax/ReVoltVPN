name: flutter-strict

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: flutter-strict-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  strict:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned Flutter SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/flutter"
          expected_sha=d3b14c876900e553bc736ca19295fc09e3853e8e
          expected_tag=3.47.2
          git clone --depth=1 --branch "$expected_tag" --single-branch \
            https://github.com/flutter/flutter.git "$sdk"
          actual_sha="$(git -C "$sdk" rev-parse HEAD)"
          actual_tag="$(git -C "$sdk" describe --tags --exact-match HEAD)"
          [[ "$actual_sha" == "$expected_sha" ]] || {
            echo "Flutter tag moved: expected $expected_sha, got $actual_sha"
            exit 1
          }
          [[ "$actual_tag" == "$expected_tag" ]] || {
            echo "Flutter release identity mismatch: expected $expected_tag, got $actual_tag"
            exit 1
          }
          printf '%s\n' "$sdk/bin" >> "$GITHUB_PATH"
          "$sdk/bin/flutter" --version

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib

      - name: Analyze Flutter sources
        run: flutter analyze

      - name: Run tests when present
        shell: bash
        run: |
          set -euo pipefail
          if find test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test
          else
            echo 'No Flutter tests are present yet; analyze/format gates still apply.'
          fi
