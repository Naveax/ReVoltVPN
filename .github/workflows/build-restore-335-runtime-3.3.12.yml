name: Build 3.3.12 restore 3.3.5 runtime

on:
  push:
    branches:
      - fix/restore-3.3.5-runtime-3.3.12

permissions:
  contents: read

concurrency:
  group: restore-335-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Generate local build config
        shell: bash
        run: |
          cat > lib/logic/app_config.dart <<'DART'
          abstract final class AppConfig {
            AppConfig._();
            static const String serverIp = '204.168.246.88';
            static const String hivemindApiPublic = 'https://paladinvpn.duckdns.org/api';
            static const String realityFp = 'chrome';
            static const String vlessSecurity = 'reality';
            static const String vlessType = 'xhttp';
            static const String vlessPath = '/revolt';
            static const String applicationId = 'com.paladinvpn.app';
            static const String githubOwner = 'esefxdz';
            static const String githubRepo = 'ReVoltVPN';
            static const String githubReleasesUrl =
                'https://github.com/$githubOwner/$githubRepo/releases/latest';
            static const String adUnitId =
                'ca-app-pub-5671224884648691/9198987725';
          }
          DART

          cat > android/admob.properties <<'PROPS'
          ADMOB_APP_ID=ca-app-pub-3940256099942544~3347511713
          PROPS

          {
            printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT"
            printf 'sdk.dir=%s\n' "$ANDROID_HOME"
          } > android/local.properties

      - name: Generate temporary release signing key
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore android/revolt-restore-335.jks \
            -storepass revoltrestore335 \
            -keypass revoltrestore335 \
            -alias revolt-restore-335 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=ReVoltVPN Runtime Restore,O=ReVoltVPN,C=US"

          cat > android/key.properties <<'PROPS'
          storePassword=revoltrestore335
          keyPassword=revoltrestore335
          keyAlias=revolt-restore-335
          storeFile=revolt-restore-335.jks
          PROPS

      - name: Generate Gradle wrapper
        shell: bash
        run: |
          cd android
          gradle wrapper --gradle-version 8.14 --distribution-type all
          chmod +x gradlew
          ./gradlew --version

      - name: Flutter pub get
        run: flutter pub get

      - name: Verify stock 1.1.5 runtime selection
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import unquote, urlparse

          pubspec = Path('pubspec.yaml').read_text()
          assert 'dependency_overrides:' not in pubspec

          data = json.loads(Path('.dart_tool/package_config.json').read_text())
          package = next(p for p in data['packages'] if p['name'] == 'flutter_vless_android')
          parsed = urlparse(package['rootUri'])
          root = Path(unquote(parsed.path)) if parsed.scheme == 'file' else \
              (Path('.dart_tool') / unquote(package['rootUri'])).resolve()
          assert 'flutter_vless_android-1.1.5' in str(root), root

          vpn = Path('lib/logic/vpn_connection.dart').read_text()
          assert 'NativeTunnelControl' not in vpn
          assert '127.0.0.1:10807' in vpn
          assert 'verifyLocalSocks: true' in vpn
          assert '_waitForNativeConnected()' in vpn
          assert 'proxyOnly: false' in vpn

          timer = Path('lib/logic/session_timer.dart').read_text()
          assert 'activeValue is! bool' in timer
          assert 'expiresValue is! num' in timer
          assert '!expiresValue.isFinite' in timer
          assert 'expiresValue < 0' in timer

          print('Stock flutter_vless_android 1.1.5 selected; current SessionTimer hardening retained')
          PY

      - name: Analyze routing patcher
        run: dart analyze tool/patch_flutter_vless_allowed_apps.dart

      - name: Apply proven 3.3.5 routing patch
        shell: bash
        run: |
          cd android
          ./gradlew :app:patchFlutterVlessAllowedApps

      - name: Prove patch idempotence and invariants
        shell: bash
        run: |
          cd android
          ./gradlew :app:patchFlutterVlessAllowedApps --rerun-tasks
          cd ..
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import unquote, urlparse

          data = json.loads(Path('.dart_tool/package_config.json').read_text())
          package = next(p for p in data['packages'] if p['name'] == 'flutter_vless_android')
          parsed = urlparse(package['rootUri'])
          root = Path(unquote(parsed.path)) if parsed.scheme == 'file' else \
              (Path('.dart_tool') / unquote(package['rootUri'])).resolve()
          kotlin = root / 'android/src/main/kotlin/com/github/tfox/flutter_vless'
          plugin = (kotlin / 'FlutterVlessPlugin.kt').read_text()
          config = (kotlin / 'xray/dto/XrayConfig.kt').read_text()
          service = (kotlin / 'xray/service/XrayVPNService.kt').read_text()

          assert '"setAllowedApps" ->' in plugin
          assert 'config.ALLOWED_APPS = ArrayList(allowedApps)' in plugin
          assert 'var ALLOWED_APPS:' in config
          assert 'Allowed and blocked app policies cannot be mixed' in service
          assert 'Stopping stale Xray core before restart' in service
          assert 'Could not delete stale tun2socks socket' in service
          assert 'builder.addAllowedApplication(pkg)' in service
          print('3.3.5 routing/runtime patch invariants verified')
          PY

      - name: Flutter analyze
        run: flutter analyze --no-fatal-warnings

      - name: Migration unit test
        run: flutter test test/no_ass_migration_test.dart

      - name: Kotlin release compile
        shell: bash
        run: |
          cd android
          ./gradlew :app:compileReleaseKotlin --stacktrace

      - name: Build 3.3.12 APK
        run: flutter build apk --release --build-name 3.3.12 --build-number 41

      - name: Verify packaged VPN runtime
        shell: bash
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep 'libtun2socks.so'
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep 'libxray.so'

      - name: Package APK
        shell: bash
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk ReVoltVPN-3.3.12-restore-3.3.5-runtime.apk
          sha256sum ReVoltVPN-3.3.12-restore-3.3.5-runtime.apk > ReVoltVPN-3.3.12-restore-3.3.5-runtime.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReVoltVPN-3.3.12-restore-3.3.5-runtime
          path: |
            ReVoltVPN-3.3.12-restore-3.3.5-runtime.apk
            ReVoltVPN-3.3.12-restore-3.3.5-runtime.apk.sha256
          retention-days: 7
          if-no-files-found: error
