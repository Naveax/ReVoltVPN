name: Apply runtime state hardening

on:
  push:
    branches:
      - fix/3.3.2-esef-security-cleanup
    paths:
      - tool/apply_runtime_state_hardening.py
      - .github/workflows/apply-runtime-state-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/3.3.2-esef-security-cleanup

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false

      - name: Create CI app config
        run: cp lib/logic/app_config.example.dart lib/logic/app_config.dart

      - name: Apply guarded runtime hardening
        run: python3 tool/apply_runtime_state_hardening.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify dependency lock is committed
        run: git diff --exit-code -- pubspec.lock

      - name: Analyze patched source
        run: flutter analyze

      - name: Test patched source
        run: flutter test

      - name: Compile patched debug APK
        run: flutter build apk --debug --no-pub

      - name: Verify patch hygiene and AdMob contract
        run: |
          git diff --check
          test ! -e .github/workflows/apply-runtime-state-hardening.yml
          test ! -e tool/apply_runtime_state_hardening.py
          grep -Fq '/admob/callback?signature=test&key_id=test&custom_data=' lib/logic/hivemind_service.dart
          grep -Fq 'Validation bypass behavior is intentionally best-effort' lib/logic/hivemind_service.dart
          grep -Fq 'RUNTIME_TOKEN' local_packages/flutter_vless_android-1.1.5/android/src/main/kotlin/com/github/tfox/flutter_vless/xray/dto/XrayConfig.kt
          grep -Fq 'RUNTIME_READY' local_packages/flutter_vless_android-1.1.5/android/src/main/kotlin/com/github/tfox/flutter_vless/xray/utils/AppConfigs.kt
          grep -Fq 'setSessionDeadline' local_packages/flutter_vless_android-1.1.5/android/src/main/kotlin/com/github/tfox/flutter_vless/FlutterVlessPlugin.kt
          grep -Fq 'markRuntimeReady' local_packages/flutter_vless_android-1.1.5/android/src/main/kotlin/com/github/tfox/flutter_vless/xray/core/XrayCoreManager.kt
          grep -Fq 'BOOTSTRAP_SESSION_SECONDS' local_packages/flutter_vless_android-1.1.5/android/src/main/kotlin/com/github/tfox/flutter_vless/xray/service/XrayVPNService.kt
          git diff --exit-code HEAD -- lib/logic/ad_manager.dart lib/logic/consent_manager.dart lib/widgets/connect_button.dart

      - name: Commit patched source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m 'hardening: bind runtime state to native generation'
          git push origin HEAD:fix/3.3.2-esef-security-cleanup
