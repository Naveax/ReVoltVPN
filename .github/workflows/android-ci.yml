name: Android CI

on:
  push:
    branches:
      - fix/3.3.2-esef-security-cleanup
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false

      - name: Create CI app config
        run: cp lib/logic/app_config.example.dart lib/logic/app_config.dart

      - name: Resolve dependencies from a clean plugin cache
        shell: bash
        run: |
          rm -rf "$HOME/.pub-cache/hosted/pub.dev/flutter_vless_android-1.1.5"
          flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Verify pristine flutter_vless source
        shell: bash
        run: |
          PKG="$HOME/.pub-cache/hosted/pub.dev/flutter_vless_android-1.1.5"
          test -f "$PKG/android/src/main/AndroidManifest.xml"
          grep -q 'android:value="true"' "$PKG/android/src/main/AndroidManifest.xml"
          grep -q 'Context.RECEIVER_EXPORTED' "$PKG/android/src/main/kotlin/com/github/tfox/flutter_vless/FlutterVlessPlugin.kt"
          ! grep -q 'fd00:26:26::1' "$PKG/android/src/main/kotlin/com/github/tfox/flutter_vless/xray/service/XrayVPNService.kt"

      - name: Cold APK build
        run: flutter build apk --debug

      - name: Verify patched native invariants
        shell: bash
        run: |
          PKG="$HOME/.pub-cache/hosted/pub.dev/flutter_vless_android-1.1.5"
          MANIFEST="$PKG/android/src/main/AndroidManifest.xml"
          PLUGIN="$PKG/android/src/main/kotlin/com/github/tfox/flutter_vless/FlutterVlessPlugin.kt"
          CORE="$PKG/android/src/main/kotlin/com/github/tfox/flutter_vless/xray/core/XrayCoreManager.kt"
          SERVICE="$PKG/android/src/main/kotlin/com/github/tfox/flutter_vless/xray/service/XrayVPNService.kt"

          grep -q 'android:value="false"' "$MANIFEST"
          grep -q 'ContextCompat.RECEIVER_NOT_EXPORTED' "$PLUGIN"
          ! grep -q 'Context.RECEIVER_EXPORTED' "$PLUGIN"
          grep -q 'setPackage(context.packageName)' "$CORE"
          grep -q 'fd00:26:26::1' "$SERVICE"
          grep -q 'builder.addRoute("::", 0)' "$SERVICE"
          grep -q 'Android refused to establish VPN interface' "$SERVICE"
          ! grep -q 'val traffic = getV2rayTraffic(context)' "$CORE"

      - name: Warm APK build
        run: flutter build apk --debug

      - name: Upload APK and resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: revoltvpn-debug-ci
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            pubspec.lock
