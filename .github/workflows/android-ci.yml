name: Android CI

on:
  push:
    branches:
      - main
      - hardening/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Gradle supply chain
        shell: bash
        run: |
          set -euo pipefail
          test -x android/gradlew
          test -f android/gradlew.bat
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -s android/gradle/verification-metadata.xml
          test "$(sha256sum android/gradle/wrapper/gradle-wrapper.jar | awk '{print $1}')" = '7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172'
          grep -qx 'distributionSha256Sum=efe9a3d147d948d7528a9887fa35abcf24ca1a43ad06439996490f77569b02d1' android/gradle/wrapper/gradle-wrapper.properties
          grep -q '<verify-metadata>true</verify-metadata>' android/gradle/verification-metadata.xml
          ./android/gradlew --version

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false

      - name: Verify Flutter SDK identity
        shell: bash
        run: |
          set -euo pipefail
          expected_version='3.47.2'
          expected_sha='d3b14c876900e553bc736ca19295fc09e3853e8e'
          version_json="$(flutter --version --machine)"
          actual_version="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["frameworkVersion"])' <<<"$version_json")"
          actual_sha="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["frameworkRevision"])' <<<"$version_json")"
          test "$actual_version" = "$expected_version" || {
            echo "Flutter version mismatch: expected $expected_version, got $actual_version"
            exit 1
          }
          test "$actual_sha" = "$expected_sha" || {
            echo "Flutter framework revision mismatch: expected $expected_sha, got $actual_sha"
            exit 1
          }

      - name: Create CI app config
        run: cp lib/logic/app_config.example.dart lib/logic/app_config.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify dependency lock is committed
        run: git diff --exit-code -- pubspec.lock

      - name: Verify vendored runtime provenance
        if: ${{ hashFiles('local_packages/flutter_vless_android-1.1.5/UPSTREAM') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          PKG='local_packages/flutter_vless_android-1.1.5'
          test -f "$PKG/UPSTREAM"
          grep -q 'Tag: v1.1.5' "$PKG/UPSTREAM"
          grep -q 'path: local_packages/flutter_vless_android-1.1.5' pubspec.yaml
          ! grep -q 'patchFlutterVless' android/app/build.gradle.kts

      - name: Analyze
        run: flutter analyze

      - name: Test Dart and Flutter regressions
        run: flutter test

      - name: Test vendored Kotlin security regressions
        working-directory: android
        run: ./gradlew :flutter_vless_android:testDebugUnitTest --no-daemon

      - name: Android lint
        working-directory: android
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Verify production release config fails closed
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          set +e
          output="$(./gradlew :app:verifyReleaseAppConfig --no-daemon 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -Fq 'REVOLT_APP_CONFIG_SHA256 is required for production release builds' <<<"$output"

      - name: Cold APK build
        run: flutter build apk --debug

      - name: Verify vendored native source stayed immutable
        run: git diff --exit-code -- local_packages/flutter_vless_android-1.1.5

      - name: Warm APK build
        run: flutter build apk --debug

      - name: Release R8 smoke build
        env:
          REVOLT_CI_RELEASE_SMOKE: 'true'
        run: |
          flutter build apk --release
          test -f build/app/outputs/flutter-apk/app-release.apk
          test -f build/app/outputs/mapping/release/mapping.txt

      - name: Record release-smoke source provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/provenance
          apk='build/app/outputs/flutter-apk/app-release.apk'
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse HEAD^{tree})"
          apk_sha="$(sha256sum "$apk" | awk '{print $1}')"
          lock_sha="$(sha256sum pubspec.lock | awk '{print $1}')"
          wrapper_sha="$(sha256sum android/gradle/wrapper/gradle-wrapper.jar | awk '{print $1}')"
          runtime_source_sha="$(git rev-parse HEAD:local_packages/flutter_vless_android-1.1.5)"
          flutter_sha="$(flutter --version --machine | python3 -c 'import json,sys; print(json.load(sys.stdin)["frameworkRevision"])')"
          test "$flutter_sha" = 'd3b14c876900e553bc736ca19295fc09e3853e8e'
          cat > build/provenance/release-smoke.env <<EOF
          provenance_format=revolt-release-v1
          source_commit=$source_sha
          source_tree=$source_tree
          apk_sha256=$apk_sha
          pubspec_lock_sha256=$lock_sha
          gradle_wrapper_sha256=$wrapper_sha
          vendored_runtime_tree=$runtime_source_sha
          flutter_version=3.47.2
          flutter_framework_sha=$flutter_sha
          java_version=17
          signing_profile=ci-debug-key-release-smoke-not-for-distribution
          EOF
          test -s build/provenance/release-smoke.env

      - name: Verify tracked build inputs stayed immutable
        run: |
          git diff --exit-code -- \
            .github/workflows/android-ci.yml \
            pubspec.yaml \
            pubspec.lock \
            local_packages/flutter_vless_android-1.1.5 \
            android/app/build.gradle.kts \
            android/app/proguard-rules.pro \
            android/gradle/verification-metadata.xml \
            android/gradle/wrapper/gradle-wrapper.properties \
            android/gradle/wrapper/gradle-wrapper.jar \
            android/gradlew \
            android/gradlew.bat

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: revoltvpn-debug-apk
          if-no-files-found: error
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload release-smoke provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: revoltvpn-release-smoke-provenance
          if-no-files-found: error
          path: build/provenance/release-smoke.env

      - name: Upload resolved lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: revoltvpn-resolved-lockfile
          if-no-files-found: error
          path: pubspec.lock
