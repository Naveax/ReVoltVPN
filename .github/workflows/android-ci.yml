name: Android CI

on:
  push:
    branches:
      - main
      - work/upstream-3.3.5-verified-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Gradle supply chain
        shell: bash
        run: |
          set -euo pipefail
          test -x android/gradlew
          test -f android/gradlew.bat
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -s android/gradle/verification-metadata.xml
          test "$(sha256sum android/gradle/wrapper/gradle-wrapper.jar | awk '{print $1}')" = '7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172'
          grep -qx 'distributionSha256Sum=efe9a3d147d948d7528a9887fa35abcf24ca1a43ad06439996490f77569b02d1' android/gradle/wrapper/gradle-wrapper.properties
          grep -q '<verify-metadata>true</verify-metadata>' android/gradle/verification-metadata.xml
          ./android/gradlew --version

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false

      - name: Create CI app config
        run: cp lib/logic/app_config.example.dart lib/logic/app_config.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify dependency lock is committed
        run: git diff --exit-code -- pubspec.lock

      - name: Verify vendored runtime provenance
        if: ${{ hashFiles('local_packages/flutter_vless_android-1.1.5/UPSTREAM') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          PKG='local_packages/flutter_vless_android-1.1.5'
          test -f "$PKG/UPSTREAM"
          grep -q 'Tag: v1.1.5' "$PKG/UPSTREAM"
          grep -q 'path: local_packages/flutter_vless_android-1.1.5' pubspec.yaml
          ! grep -q 'patchFlutterVless' android/app/build.gradle.kts

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Native Kotlin regression tests
        working-directory: android
        run: ./gradlew :flutter_vless_android:testDebugUnitTest --no-daemon

      - name: Verify native Kotlin test evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          paths = glob.glob('**/test-results/testDebugUnitTest/TEST-*.xml', recursive=True)
          if not paths:
              raise SystemExit('native JUnit XML was not produced')

          required = {
              'com.github.tfox.flutter_vless.xray.core.XrayCoreManagerTest': 5,
              'com.github.tfox.flutter_vless.xray.core.CoreConfigPipeTest': 3,
              'com.github.tfox.flutter_vless.VersionProbeTest': 5,
              'com.github.tfox.flutter_vless.xray.core.RuntimeGenerationTest': 3,
              'com.github.tfox.flutter_vless.xray.service.RuntimeRecoveryGateTest': 3,
          }
          seen = {}
          for path in paths:
              root = ET.parse(path).getroot()
              name = root.attrib.get('name', '')
              tests = int(root.attrib.get('tests', '0'))
              failures = int(root.attrib.get('failures', '0'))
              errors = int(root.attrib.get('errors', '0'))
              skipped = int(root.attrib.get('skipped', '0'))
              if failures or errors or skipped:
                  raise SystemExit(
                      f'{name}: failures={failures} errors={errors} skipped={skipped}'
                  )
              seen[name] = seen.get(name, 0) + tests

          missing = []
          for suite, minimum in required.items():
              actual = seen.get(suite, 0)
              if actual < minimum:
                  missing.append(f'{suite}: expected >= {minimum}, got {actual}')
          if missing:
              raise SystemExit('required native tests did not execute: ' + '; '.join(missing))
          print('Native JUnit evidence OK:', seen)
          PY

      - name: Upload native test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-kotlin-junit
          if-no-files-found: warn
          path: '**/test-results/testDebugUnitTest/TEST-*.xml'

      - name: Android lint
        working-directory: android
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Verify production release config fails closed
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          set +e
          output="$(./gradlew :app:verifyReleaseAppConfig --no-daemon 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -Fq 'REVOLT_APP_CONFIG_SHA256 is required for production release builds' <<<"$output"

      - name: Verify runtime secret transport contract
        shell: bash
        run: |
          set -euo pipefail
          CORE='local_packages/flutter_vless_android-1.1.5/android/src/main/kotlin/com/github/tfox/flutter_vless/xray/core/XrayCoreManager.kt'
          grep -Fq '"stdin:"' "$CORE"
          ! grep -Fq 'writeText(configJson' "$CORE"
          ! grep -Fq '"-config", File(' "$CORE"

      - name: Verify unsupported always-on stays fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = 'local_packages/flutter_vless_android-1.1.5/android/src/main/AndroidManifest.xml'
          root = ET.parse(path).getroot()
          ns = '{http://schemas.android.com/apk/res/android}'
          service_name = 'com.github.tfox.flutter_vless.xray.service.XrayVPNService'
          services = [
              node for node in root.findall('./application/service')
              if node.attrib.get(ns + 'name') == service_name
          ]
          if len(services) != 1:
              raise SystemExit(f'expected exactly one XrayVPNService, got {len(services)}')
          metadata = [
              node for node in services[0].findall('meta-data')
              if node.attrib.get(ns + 'name') == 'android.net.VpnService.SUPPORTS_ALWAYS_ON'
          ]
          if len(metadata) != 1 or metadata[0].attrib.get(ns + 'value') != 'false':
              raise SystemExit(
                  'SUPPORTS_ALWAYS_ON must remain false until protected bootstrap/lockdown support is implemented'
              )
          print('Always-on capability remains explicitly fail-closed.')
          PY

      - name: Verify Android app data and network security policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          android = '{http://schemas.android.com/apk/res/android}'
          manifest = ET.parse('android/app/src/main/AndroidManifest.xml').getroot()
          app = manifest.find('application')
          if app is None:
              raise SystemExit('application element missing')

          expected_attrs = {
              android + 'allowBackup': 'false',
              android + 'usesCleartextTraffic': 'false',
              android + 'networkSecurityConfig': '@xml/network_security_config',
              android + 'fullBackupContent': '@xml/backup_rules',
              android + 'dataExtractionRules': '@xml/data_extraction_rules',
          }
          for key, expected in expected_attrs.items():
              actual = app.attrib.get(key)
              if actual != expected:
                  raise SystemExit(f'manifest security policy mismatch: {key}={actual!r}, expected {expected!r}')

          net = ET.parse('android/app/src/main/res/xml/network_security_config.xml').getroot()
          base = net.find('base-config')
          if base is None or base.attrib.get('cleartextTrafficPermitted') != 'false':
              raise SystemExit('network security config must disable cleartext')
          certs = base.findall('./trust-anchors/certificates')
          sources = [node.attrib.get('src') for node in certs]
          if sources != ['system']:
              raise SystemExit(f'network trust anchors must be system-only, got {sources!r}')

          required_domains = {'root', 'file', 'database', 'sharedpref', 'external'}
          rules = ET.parse('android/app/src/main/res/xml/data_extraction_rules.xml').getroot()
          for section_name in ('cloud-backup', 'device-transfer'):
              section = rules.find(section_name)
              if section is None:
                  raise SystemExit(f'{section_name} rules missing')
              excluded = {
                  node.attrib.get('domain')
                  for node in section.findall('exclude')
                  if node.attrib.get('path') == '.'
              }
              if excluded != required_domains:
                  raise SystemExit(f'{section_name} exclusions incomplete: {excluded!r}')

          legacy = ET.parse('android/app/src/main/res/xml/backup_rules.xml').getroot()
          excluded = {
              node.attrib.get('domain')
              for node in legacy.findall('exclude')
              if node.attrib.get('path') == '.'
          }
          if excluded != required_domains:
              raise SystemExit(f'legacy backup exclusions incomplete: {excluded!r}')
          print('Android app data/network security policy OK.')
          PY

      - name: Cold APK build
        run: flutter build apk --debug

      - name: Verify vendored native source stayed immutable
        run: git diff --exit-code -- local_packages/flutter_vless_android-1.1.5

      - name: Warm APK build
        run: flutter build apk --debug

      - name: Release R8 smoke build
        env:
          REVOLT_CI_RELEASE_SMOKE: 'true'
        run: |
          flutter build apk --release
          test -f build/app/outputs/flutter-apk/app-release.apk
          test -f build/app/outputs/mapping/release/mapping.txt

      - name: Verify tracked build inputs stayed immutable
        run: |
          git diff --exit-code -- \
            pubspec.yaml \
            pubspec.lock \
            local_packages/flutter_vless_android-1.1.5 \
            android/app/build.gradle.kts \
            android/app/proguard-rules.pro \
            android/gradle/verification-metadata.xml \
            android/gradle/wrapper/gradle-wrapper.properties \
            android/gradle/wrapper/gradle-wrapper.jar \
            android/gradlew \
            android/gradlew.bat

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: revoltvpn-debug-apk
          if-no-files-found: error
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload resolved lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: revoltvpn-resolved-lockfile
          if-no-files-found: error
          path: pubspec.lock
