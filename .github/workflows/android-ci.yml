name: Android CI

on:
  push:
    branches:
      - fix/android-runtime-reliability
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Provision CI app config
        run: cp lib/logic/app_config.example.dart lib/logic/app_config.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze Dart
        shell: bash
        run: |
          mkdir -p build/ci-logs
          set -o pipefail
          flutter analyze 2>&1 | tee build/ci-logs/flutter-analyze.log

      - name: Run security/runtime invariants
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee build/ci-logs/flutter-test.log

      - name: Build debug APK (cold patch pass)
        shell: bash
        run: |
          mkdir -p build/ci-logs
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build/ci-logs/flutter-build-cold.log

      - name: Build debug APK again (patch idempotency)
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build/ci-logs/flutter-build-warm.log

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-diagnostics
          path: build/ci-logs/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: revoltvpn-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
