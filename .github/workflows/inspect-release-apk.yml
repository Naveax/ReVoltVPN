name: Inspect published release APK

on:
  push:
    branches:
      - probe/vpn-server-204

permissions:
  contents: read

concurrency:
  group: inspect-release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and inspect v3.2.2 APK
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o app-release.apk \
            https://github.com/esefxdz/ReVoltVPN/releases/download/v3.2.2/app-release.apk
          mkdir apk
          unzip -q app-release.apk -d apk

          echo '=== Exact relevant strings ==='
          find apk -type f \( -name '*.so' -o -name '*.dex' -o -name '*.json' -o -name '*.xml' \) -print0 \
            | xargs -0 -r strings -a \
            | grep -Eai 'userevolt|getrevolt|hivemind|session/status|admob/callback|reality|vless|204\.168\.|https?://' \
            | sort -u \
            | head -n 500 || true

          echo '=== Host/domain candidates from libapp ==='
          find apk/lib -type f -name 'libapp.so' -print0 \
            | xargs -0 -r strings -a \
            | grep -Eao 'https?://[^[:space:]"<>]+|([A-Za-z0-9_-]+\.)+[A-Za-z]{2,}|([0-9]{1,3}\.){3}[0-9]{1,3}' \
            | sort -u \
            | grep -Ev '^(dart|flutter|google|github|w3|android|schemas|pub|example)\.' \
            | head -n 400 || true
