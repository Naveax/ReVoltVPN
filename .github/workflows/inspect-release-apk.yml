name: Probe VPN control-plane routes

on:
  push:
    branches:
      - probe/vpn-server-204

permissions:
  contents: read

concurrency:
  group: probe-vpn-control-plane-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe read-only API routes on historical server
        shell: bash
        run: |
          set +e
          host=204.168.246.88
          paths=(
            '/session/status?device_id=diagnostic-probe'
            '/api/v2/session/status?device_id=diagnostic-probe'
            '/api/session/status?device_id=diagnostic-probe'
            '/config?device_id=diagnostic-probe'
          )
          for path in "${paths[@]}"; do
            for base in "http://$host" "https://$host"; do
              url="$base$path"
              echo "=== $url ==="
              curl -k -sS --max-time 8 -D /tmp/headers -o /tmp/body \
                -w 'HTTP=%{http_code} IP=%{remote_ip} CT=%{content_type}\n' "$url"
              sed -n '1,12p' /tmp/headers || true
              head -c 800 /tmp/body || true
              echo
            done
          done
