name: Verification metadata Guava fix

on:
  push:
    branches:
      - fix/3.3.2-esef-security-cleanup
    paths:
      - .github/workflows/verification-metadata-guava-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Add independently verified Guava parent checksum
        shell: bash
        run: |
          set -euo pipefail

          FILE='android/gradle/verification-metadata.xml'
          CI='.github/workflows/android-ci.yml'
          EXPECTED_POM_SHA='55441db27e8869dfefe053059bdf478bdc7e95585642bf391f0023345fd56287'
          POM_URL='https://repo.maven.apache.org/maven2/com/google/guava/guava-parent/33.3.1-jre/guava-parent-33.3.1-jre.pom'

          test "$(git hash-object "$FILE")" = 'e48bca7d6225665ef33cc0dc4bf0609be0631996'
          test "$(git hash-object "$CI")" = '2472447527db58ba5c52ee3b09b89ea5373b2ea0'

          ACTUAL_POM_SHA="$(curl --fail --silent --show-error --location "$POM_URL" | sha256sum | awk '{print $1}')"
          test "$ACTUAL_POM_SHA" = "$EXPECTED_POM_SHA"

          python3 -c 'from pathlib import Path; p=Path("android/gradle/verification-metadata.xml"); s=p.read_text(encoding="utf-8"); marker="   </components>\n"; needle="name=\"guava-parent\" version=\"33.3.1-jre\""; block="      <component group=\"com.google.guava\" name=\"guava-parent\" version=\"33.3.1-jre\">\n         <artifact name=\"guava-parent-33.3.1-jre.pom\">\n            <sha256 value=\"55441db27e8869dfefe053059bdf478bdc7e95585642bf391f0023345fd56287\" origin=\"Independently verified\"/>\n         </artifact>\n      </component>\n"; assert needle not in s, "Guava parent entry already exists"; assert s.count(marker)==1, "metadata closing marker missing or ambiguous"; p.write_text(s.replace(marker, block+marker, 1), encoding="utf-8")'
          python3 -c 'import xml.etree.ElementTree as ET; ET.parse("android/gradle/verification-metadata.xml")'
          grep -q "$EXPECTED_POM_SHA" "$FILE"

          META_GIT_SHA="$(git hash-object "$FILE")"
          META_SHA256="$(sha256sum "$FILE" | awk '{print $1}')"

          sed -i "s/e48bca7d6225665ef33cc0dc4bf0609be0631996/$META_GIT_SHA/" "$CI"
          sed -i "s/90f66e5c14f1b20222b593f6beaa66e5d39ab91456a6abec8af57db25e5efad6/$META_SHA256/" "$CI"
          grep -q "$META_GIT_SHA" "$CI"
          grep -q "$META_SHA256" "$CI"

          git rm .github/workflows/verification-metadata-guava-fix.yml
          git add "$FILE" "$CI"
          git diff --cached --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(android): trust Guava parent verification metadata'
          git push origin "HEAD:$GITHUB_REF_NAME"
