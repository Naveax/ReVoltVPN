name: revoltvpn
description: ReVolt VPN — Secure VLESS tunnel for Android

publish_to: "none"
version: 3.2.2+25

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.5
  google_fonts: ^6.1.0
  provider: ^6.1.1
  google_mobile_ads: ^4.0.0
  flutter_vless: 1.1.5
  http: ^1.6.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  flutter_secure_storage: ^10.3.1
  uuid: ^4.5.3
  flutter_local_notifications: ^17.0.0
  path_provider: ^2.1.5
  package_info_plus: ^6.0.0

dependency_overrides:
  # Keep the public flutter_vless Dart API pinned while isolating the Android
  # implementation inside this repository. Builds no longer mutate global
  # Pub cache sources.
  flutter_vless_android:
    path: third_party/flutter_vless_android

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
